<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Simple Backrooms Survival Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <style>
    /* Кнопка меню слева сверху */
    .sidebar-toggle {
      top: 10px !important;
      bottom: auto !important;
      left: 10px !important;
      background: #ffaa00 !important; /* Оранжевая, чтобы видно было */
      border-radius: 5px;
      width: 40px;
      height: 40px;
      padding: 5px;
    }
    /* Чтобы текст не налезал на кнопку */
    .content {
      padding-top: 60px !important;
    }
  </style>
</head>
<body>
  <div id="app">Загрузка...</div>
  <script>
    window.$docsify = {
      name: 'Backrooms Wiki',
      loadSidebar: true,
      subMaxLevel: 2,
      // Авто-раскрытие меню
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
