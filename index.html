<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Simple Backrooms Survival Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <style>
    /* Твоя большая удобная кнопка слева сверху */
    .sidebar-toggle {
      top: 10px !important;
      bottom: auto !important;
      left: 10px !important;
      background: #ffaa00 !important;
      border-radius: 5px;
      width: 45px !important;
      height: 45px !important;
      display: flex !important;
      align-items: center;
      justify-content: center;
    }
    /* Исправляем отступы, чтобы текст не закрывала кнопка */
    body.close .sidebar-toggle {
      width: 45px !important;
    }
    .content {
      padding-top: 60px !important;
    }
    /* Цвет текста в меню, чтобы его было видно */
    .sidebar ul li a {
      color: #eee !important;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="app">Загрузка архивов...</div>
  <script>
    window.$docsify = {
      name: 'Backrooms Wiki',
      loadSidebar: true, // ВКЛЮЧАЕМ МЕНЮ
      autoHeader: true,
      subMaxLevel: 3,
      // Этот блок исправляет твою проблему с пустым меню:
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
