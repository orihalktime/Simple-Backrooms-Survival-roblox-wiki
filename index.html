<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <style>
    .sidebar-toggle {
      top: 10px !important;
      left: 10px !important;
      background: #ffaa00 !important;
      width: 45px !important;
      height: 45px !important;
      border-radius: 5px;
    }
    section.content { padding-top: 60px !important; }
    /* Чтобы ссылки в меню были яркими */
    .sidebar ul li a { color: #fff !important; font-size: 16px; }
  </style>
</head>
<body>
  <div id="app">Загрузка...</div>
  <script>
    window.$docsify = {
      name: 'Backrooms Wiki',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
