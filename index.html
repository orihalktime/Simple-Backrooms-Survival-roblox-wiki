<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Simple Backrooms Survival Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <style>
    /* Большая кнопка слева сверху */
    .sidebar-toggle {
      top: 10px !important;
      left: 10px !important;
      background: #ffaa00 !important;
      width: 50px !important;
      height: 50px !important;
      display: flex !important;
      z-index: 999;
    }
    /* Делаем меню видимым на темном фоне */
    .sidebar {
      background-color: #222 !important;
      color: #fff !important;
    }
    .sidebar ul li a {
      color: #fff !important;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="app">Загрузка архивов...</div>
  <script>
    window.$docsify = {
      name: 'Backrooms Wiki',
      loadSidebar: true, // Это включает файл _sidebar.md
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md' // Путь к меню
      },
      subMaxLevel: 2
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
